<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101b2b"><title>100層ダンジョン | 探索試作 v0.1</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b1220;color:#ecf4ff;font-family:system-ui,-apple-system,sans-serif}main{max-width:570px;margin:auto;padding:18px 14px 40px}h1{font-size:23px;margin:8px 0}h2{font-size:16px;margin:4px 0 10px}.sub{color:#a5b8d1;font-size:13px}.panel{border:1px solid #304158;border-radius:16px;background:#172439;padding:15px;margin:14px 0}header{display:flex;justify-content:space-between;align-items:center;gap:8px}.pill{background:#334861;border-radius:99px;padding:6px 10px;font-size:12px}.map{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}.tile{aspect-ratio:1;border:1px solid #405270;border-radius:9px;background:#24344b;color:#e8f2ff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:2px;font-size:clamp(9px,2.6vw,12px);touch-action:manipulation;cursor:pointer}.tile .emoji{font-size:clamp(20px,5vw,28px)}.tile.hidden{background:linear-gradient(135deg,#49556b,#29374e);color:#b9c8db}.tile.adj{border:2px solid #7bb5ff}.tile.here{background:#205887;border:3px solid #a3ddff}.tile.used{opacity:.76}.tile:disabled{cursor:default}.tile:focus-visible,button:focus-visible{outline:3px solid #fff;outline-offset:2px}button.action{background:#3d79bf;color:white;padding:12px 16px;border:0;border-radius:10px;font-size:15px;font-weight:650;cursor:pointer}button.action.secondary{background:#36465e}button.action:disabled{opacity:.45;cursor:default}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.status{min-height:47px;line-height:1.55;margin:12px 0;color:#f4dc98}.legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}.legend span{font-size:11px;border:1px solid #405270;border-radius:8px;padding:6px}details{margin-top:12px;color:#b9cce3}summary{cursor:pointer}.stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.stats span{background:#24364d;padding:7px;border-radius:8px;font-size:12px}.log{font-size:12px;line-height:1.8;color:#b7c9e0;max-height:145px;overflow:auto}.hide{display:none}.base{text-align:center;padding:20px 5px}small{color:#a5b8d1}
</style></head><body><main>
<header><div><div class="sub">EXPLORATION PROTOTYPE · v0.1.0</div><h1>100層ダンジョン</h1></div><span class="pill" id="floorBadge">基地</span></header>
<div id="base" class="panel base"><div style="font-size:44px">🏰</div><h2>探索基地</h2><p class="sub">装備・合成・仲間編成は今後実装予定。<br>今は石版を開けて、階段を探そう！</p><button class="action" id="depart">ダンジョンへ出発</button><p class="sub" id="resumeNote"></p></div>
<div id="game" class="hide">
<div class="stats"><span id="progress">開放 1 / 30</span><span>HP <b id="hp">100</b>/100</span><span>SP <b id="sp">100</b>/100</span><span>所持金 <b id="gold">0</b>G</span></div>
<section class="panel"><h2>石版マップ</h2><p class="sub">光る隣接マスをタップ。石版なら開放と同時に移動します。</p><div class="map" id="map" aria-label="5列6行の探索マップ"></div><p id="message" class="status" aria-live="polite"></p><div class="actions" id="actions"></div></section>
<section class="panel"><h2>探索ログ</h2><div id="log" class="log"></div><details><summary>マスの種類</summary><div class="legend" id="legend"></div></details></section>
</div><p class="sub">仮バージョン：戦闘・ショップ・宝箱・仲間イベントはメッセージのみです。探知機能は後日実装。</p>
</main><script>
(()=>{
"use strict";
const KEY="hundred-floor-dungeon-v01";
const definitions={
empty:{icon:"·",name:"空白",weight:45,min:9,max:17},
hp:{icon:"❤️",name:"HP回復",weight:10,min:1,max:5},
sp:{icon:"💠",name:"SP回復",weight:10,min:1,max:5},
battle:{icon:"⚔️",name:"通常戦闘",weight:11,min:1,max:6},
strong:{icon:"👹",name:"強敵戦闘",weight:3,min:0,max:2},
rare:{icon:"💎",name:"レア戦闘",weight:1,min:0,max:1},
chest:{icon:"🎁",name:"宝箱",weight:8,min:1,max:4},
merchant:{icon:"🛒",name:"商人",weight:3,min:0,max:2},
mystery:{icon:"❔",name:"？マス",weight:9,min:1,max:4},
stairs:{icon:"⬇️",name:"階段"},return:{icon:"🏠",name:"帰還"}};
const mystery=[
{type:"good",label:"HPが回復した！",effect:s=>s.hp=Math.min(100,s.hp+10)},
{type:"good",label:"SPが回復した！",effect:s=>s.sp=Math.min(100,s.sp+10)},
{type:"good",label:"レア敵との戦闘が起こった！"},
{type:"good",label:"宝箱を発見した！"},
{type:"good",label:"仲間にまつわる出来事が起こった！"},
{type:"bad",label:"通常戦闘が起こった！"},
{type:"bad",label:"強敵との戦闘が起こった！"},
{type:"bad",label:"罠！ HPが減少した！",effect:s=>s.hp=Math.max(1,s.hp-10)},
{type:"bad",label:"罠！ SPが減少した！",effect:s=>s.sp=Math.max(0,s.sp-10)},
{type:"bad",label:"アイテムロストイベント！ （所持品システムは未実装）"}
];
let state=null;
const el=id=>document.getElementById(id),rand=n=>Math.floor(Math.random()*n);
function makeFloor(floor,character){
 const start=rand(30),possible=Array.from({length:30},(_,i)=>i).filter(i=>i!==start);
 const stairs=possible.splice(rand(possible.length),1)[0];
 let home=-1;if(floor%10===0){home=possible.splice(rand(possible.length),1)[0]}
 const count=possible.length,defs=Object.entries(definitions).filter(([k,d])=>d.weight);
 const counts=Object.fromEntries(defs.map(([k])=>[k,0]));const cells=Array(30).fill(null);
 cells[start]={type:"empty",open:true,used:true};cells[stairs]={type:"stairs",open:false,used:false};
 if(home>=0)cells[home]={type:"return",open:false,used:false};
 for(let n=0;n<count;n++){
  const remaining=count-n;
  let eligible=defs.filter(([k,d])=>counts[k]<d.min);
  const required=eligible.reduce((sum,[k,d])=>sum+d.min-counts[k],0);
  if(required!==remaining) eligible=defs.filter(([k,d])=>counts[k]<d.max);
  const total=eligible.reduce((v,[k,d])=>v+d.weight,0);
  let roll=Math.random()*total,choice=eligible[eligible.length-1][0];
  for(const [k,d] of eligible){roll-=d.weight;if(roll<0){choice=k;break}}
  counts[choice]++;
  const index=possible[n];cells[index]={type:choice,open:false,used:false};
 }
 return {floor,cells,pos:start,hp:character.hp,sp:character.sp,gold:character.gold,checkpoint:character.checkpoint,log:[],msg:"新たな階層へ突入した！"};
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function say(message){state.msg=message;state.log.unshift(message);state.log=state.log.slice(0,30)}
function validSaved(s){return s&&Array.isArray(s.cells)&&s.cells.length===30&&Number.isInteger(s.floor)&&s.floor>=1&&s.floor<=100&&Number.isInteger(s.pos)&&s.pos>=0&&s.pos<30}
try{const found=JSON.parse(localStorage.getItem(KEY));if(validSaved(found))state=found;}catch(e){}
function base(){el("base").classList.remove("hide");el("game").classList.add("hide");el("floorBadge").textContent="基地";el("resumeNote").textContent=state&&state.checkpoint?"到達済み帰還地点：地下"+state.checkpoint+"F（次回はここから再挑戦）":""}
function adjacent(i){return Math.abs(Math.floor(i/5)-Math.floor(state.pos/5))+Math.abs(i%5-state.pos%5)===1}
function tileLabel(i){const c=state.cells[i];return c.open?definitions[c.type].name:"石版"}
function draw(){
 if(!state)return base();
 el("base").classList.add("hide");el("game").classList.remove("hide");el("floorBadge").textContent="地下 "+state.floor+"F";
 el("hp").textContent=state.hp;el("sp").textContent=state.sp;el("gold").textContent=state.gold;
 el("progress").textContent="開放 "+state.cells.filter(c=>c.open).length+" / 30";
 el("message").textContent=state.msg;
 const map=el("map");map.replaceChildren();
 state.cells.forEach((c,i)=>{
  const here=i===state.pos,near=adjacent(i);
  const b=document.createElement("button");b.type="button";b.className="tile "+(here?"here ":near?"adj ":"")+(c.open?"":"hidden ")+(c.used?"used":"");
  b.disabled=!near;b.setAttribute("aria-label",((Math.floor(i/5)+1)+"行"+(i%5+1)+"列、")+(here?"現在地":tileLabel(i)));
  const emoji=document.createElement("span");emoji.className="emoji";emoji.textContent=here?"🧭":c.open?definitions[c.type].icon:"▣";
  const txt=document.createElement("span");txt.textContent=here?"現在地":c.open?c.used&&c.type!=="empty"&&c.type!=="merchant"&&c.type!=="stairs"&&c.type!=="return"?"探索済":definitions[c.type].name:"石版";
  b.append(emoji,txt);b.addEventListener("click",()=>move(i));map.append(b);
 });
 const actions=el("actions");actions.replaceChildren();
 const at=state.cells[state.pos];
 if(at.type==="stairs"){button(actions,state.floor===100?"100層踏破！":"階段を降りる",()=>{if(state.floor>=100){say("100層踏破！ おめでとう！");draw();return;}state=makeFloor(state.floor+1,state);save();draw()})}
 if(at.type==="return"){button(actions,"基地に帰還する",()=>{state.checkpoint=Math.max(state.checkpoint,state.floor);save();base()})}
 if(at.type==="merchant"){button(actions,"商人に話す",()=>{say("商人に出会った！ お店は今後実装します。");save();draw()})}
 button(actions,"基地へ戻る（テスト用）",()=>{save();base()},"secondary");
 el("log").textContent="";state.log.forEach(line=>{const d=document.createElement("div");d.textContent="・"+line;el("log").append(d)});
}
function button(parent,label,fn,kind){const b=document.createElement("button");b.className="action "+(kind||"");b.textContent=label;b.addEventListener("click",fn);parent.append(b)}
function move(i){
 if(!adjacent(i))return;
 const c=state.cells[i];state.pos=i;
 if(!c.open){c.open=true;say("石版を開いた！ "+definitions[c.type].name+"マスを発見。")}
 if(!c.used){switch(c.type){
 case "hp":state.hp=Math.min(100,state.hp+10);say("HPが最大値の10%回復した！");c.used=true;break;
 case "sp":state.sp=Math.min(100,state.sp+10);say("SPが最大値の10%回復した！");c.used=true;break;
 case "battle":case "strong":case "rare":say((c.type==="battle"?"通常":c.type==="strong"?"強敵":"レア敵")+"との戦闘が起こった！（仮処理で勝利）");c.used=true;break;
 case "chest":say("宝箱を発見した！ （報酬は今後実装）");c.used=true;break;
 case "mystery":{const e=mystery[rand(mystery.length)];if(e.effect)e.effect(state);say("？イベント："+e.label);c.used=true;break}
 case "empty":c.used=true;break;
 }}
 if(c.type==="merchant")say("商人がいる。何度でも話しかけられる。");
 if(c.type==="stairs")say(state.floor===100?"最深部に到達した！":"下り階段を発見！ 次の階層へ進める。");
 if(c.type==="return")say("帰還地点を発見！ 基地へ戻ることができる。");
 save();draw();
}
el("depart").addEventListener("click",()=>{if(!state)state=makeFloor(1,{hp:100,sp:100,gold:0,checkpoint:0});else if(state.floor<=state.checkpoint)state=makeFloor(state.checkpoint,{hp:state.hp,sp:state.sp,gold:state.gold,checkpoint:state.checkpoint});save();draw()});
el("legend").replaceChildren();Object.values(definitions).forEach(d=>{const s=document.createElement("span");s.textContent=d.icon+" "+d.name;el("legend").append(s)});
base();
})();
</script></body></html>
